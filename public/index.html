<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="siteName"></h1>
    <p id="tagline"></p>
    <div class="tools">
      <input type="search" id="q" placeholder="Search by title, author or keyword" aria-label="Search stories">
      <select id="genre" aria-label="Filter by genre"><option value="">All genres</option></select>
    </div>
  </header>
  <main id="list" aria-live="polite"></main>
  <footer><span id="year"></span></footer>
</div>

<dialog id="reader">
  <div class="rhead">
    <div class="rleft"><img id="rCover" class="rcover" alt="" hidden><div><h2 id="rTitle"></h2><div class="by" id="rMeta"></div></div></div>
    <div class="row-actions">
      <a class="btn ghost" id="rDl" href="#">Download</a>
      <button class="btn" id="rClose">Close</button>
    </div>
  </div>
  <div class="rbody" id="rBody"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let stories = [];

document.title = SITE.name;
$("#siteName").textContent = SITE.name;
$("#tagline").textContent = SITE.tagline;
$("#year").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;

const cover = s => s.hasCover
  ? `<img class="cover" src="/api/stories/${esc(s.id)}/cover?v=${s.cv}" alt="Cover of ${esc(s.title)}" loading="lazy">`
  : `<div class="cover ph" aria-hidden="true">${esc([...s.title][0] || "")}</div>`;

async function load() {
  try {
    const r = await fetch("/api/stories");
    stories = await r.json();
  } catch { stories = []; }
  const genres = [...new Set(stories.map(s => s.genre).filter(Boolean))].sort();
  $("#genre").innerHTML = '<option value="">All genres</option>' + genres.map(g => `<option>${esc(g)}</option>`).join("");
  render();
}

function render() {
  const q = $("#q").value.toLowerCase(), g = $("#genre").value;
  const rows = stories.filter(s =>
    (!g || s.genre === g) &&
    (!q || [s.title, s.author, s.description].join(" ").toLowerCase().includes(q)));
  $("#list").innerHTML = rows.length ? rows.map(s => `
    <article class="story">
      ${cover(s)}<div class="info">
      <h2><button data-open="${esc(s.id)}">${esc(s.title)}</button></h2>
      <div class="by">by <b>${esc(s.author)}</b> · ${new Date(s.created).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})} · ${esc(s.ext)} · ${Math.max(1,Math.round(s.size/1024))} KB</div>
      ${s.description ? `<p>${esc(s.description)}</p>` : ""}
      <div class="row-actions">${s.genre ? `<span class="tag">${esc(s.genre)}</span>` : ""}
        <a href="/api/stories/${esc(s.id)}?download=1">Download</a></div></div>
    </article>`).join("")
    : `<p class="empty">${stories.length ? "No stories match your search." : "No stories yet. Check back soon."}</p>`;
}

async function openStory(id) {
  const s = stories.find(x => x.id === id); if (!s) return;
  $("#rTitle").textContent = s.title;
  $("#rMeta").textContent = `by ${s.author}` + (s.genre ? `, ${s.genre}` : "");
  $("#rDl").href = `/api/stories/${id}?download=1`;
  const rc = $("#rCover");
  rc.hidden = !s.hasCover;
  if (s.hasCover) rc.src = `/api/stories/${id}/cover?v=${s.cv}`;
  const body = $("#rBody"); body.replaceChildren();
  if (s.ext === "txt" || s.ext === "md") {
    const d = document.createElement("div"); d.className = "prose";
    d.textContent = "Loading…"; body.append(d);
    d.textContent = await (await fetch(`/api/stories/${id}`)).text();
  } else if (s.ext === "pdf") {
    const f = document.createElement("iframe"); f.src = `/api/stories/${id}`; f.title = s.title; body.append(f);
  } else {
    const p = document.createElement("p");
    p.textContent = "Word files can't be previewed in the browser. Use Download to read this story.";
    body.append(p);
  }
  $("#reader").showModal();
}

$("#q").addEventListener("input", render);
$("#genre").addEventListener("change", render);
$("#list").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openStory(b.dataset.open); });
$("#rClose").addEventListener("click", () => $("#reader").close());
load();
</script>
</body>
</html>
